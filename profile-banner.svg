<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Azhar Alam — AI/ML Student</title>
  <desc id="desc">A dark blue and teal profile banner with abstract connected nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#14233c"/>
      <stop offset="100%" stop-color="#111b2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#61e6b3"/>
      <stop offset="100%" stop-color="#74a7ff"/>
