  <text x="96" y="198" fill="#c2cde0" font-family="Segoe UI, Arial, sans-serif" font-size="20">Building practical Python tools, assistants &amp; apps</text>
  <rect x="96" y="222" width="202" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="197" y="245" fill="#dce8f8" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">PYTHON · STREAMLIT</text>
